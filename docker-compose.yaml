services:
  app:
    build:
      context: .
    command: uv run sw-python run python -m manage runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - database
    volumes:
      - ./app:/src/app
    networks:
      - app-network

  database:
    image: postgres:14
    restart: on-failure
    ports:
      - 5433:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network
    env_file:
      - .env
networks:
  app-network:
    driver: bridge

volumes:
  db-data:

